[versions]
# MiniMash
minimash = "0.1.0"

# Common
minecraft = { strictly = "[26.3]", prefer = "26.3" }
loom-mc = "26.3"
# https://projects.neoforged.net/neoforged/neoform
neoform = "26.3-1"
java = "25"

# Fabric
fabric = "0.19.5"
fabric-range = ">=0.19"
fabric-api = "0.162.0+26.3"
fabric-api-range = ">=0.162.0+26.3"

# NeoForge
neoforge-loader = { strictly = "[1,)", prefer = "5" }
neoforge = { strictly = "[26.3,)", prefer = "26.3.0.76" }

# Dependencies
mixin = "0.8.7"
jspecify = "1.0.1"

# Mods
modmenu = "21.0.0"

# Testing
junit = "6.1.3"

# Plugins
plugin-tasktree = "4.0.2"
plugin-java-formatting = "0.4.0"
plugin-gitchangelog = "3.4.2"
plugin-modpublish = "2.2.1"
plugin-moddevgradle = "2.0.148"
plugin-loom = "1.18.2"

[libraries]
# Common
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }

# Fabric
fabric = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
loom-minecraft = { group = "com.mojang", name = "minecraft", version.ref = "loom-mc" }

# Dependencies
modmenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modmenu" }

# Testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
# https://plugins.gradle.org/plugin/com.dorongold.task-tree
tasktree = { id = "com.dorongold.task-tree", version.ref = "plugin-tasktree" }
# https://maven.blamejared.com/net/mezzdev/java-formatting/net.mezzdev.java-formatting.gradle.plugin/maven-metadata.xml
java-formatting = { id = "net.mezzdev.java-formatting", version.ref = "plugin-java-formatting" }
# https://plugins.gradle.org/plugin/se.bjurr.gitchangelog.git-changelog-gradle-plugin
gitchangelog = { id = "se.bjurr.gitchangelog.git-changelog-gradle-plugin", version.ref = "plugin-gitchangelog" }

# Publishing
# https://plugins.gradle.org/plugin/me.modmuss50.mod-publish-plugin
modpublish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "plugin-modpublish" }

# Platform
# https://projects.neoforged.net/neoforged/moddevgradle
moddevgradle = { id = "net.neoforged.moddev", version.ref = "plugin-moddevgradle" }
# https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml
loom = { id = "net.fabricmc.fabric-loom", version.ref = "plugin-loom" }
# https://maven.fabricmc.net/net/fabricmc/fabric-loom-companion/net.fabricmc.fabric-loom-companion.gradle.plugin/maven-metadata.xml
loom-companion = { id = "net.fabricmc.fabric-loom-companion", version.ref = "plugin-loom" }
